services:
  kkutbot:
    build:
      context: .
    image: kkutbot:latest
    restart: always
    container_name: "kkutbot"
    volumes:
      - ./logs:/kkutbot/logs
      - ./backup:/kkutbot/backup
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
  mongo:
    image: mongo:7.0.37
    restart: always
    container_name: "kkutbot-mongo"
    ports:
      - "27017:27017"
    volumes:
      - ${DBPATH}:/data/db
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    command: mongod --quiet
  dbgate:
    image: dbgate/dbgate:latest
    restart: always
    container_name: "kkutbot-dbgate"
    ports:
      - "8081:3000"
    volumes:
      - dbgate-data:/root/.dbgate
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - CONNECTIONS=kkutbot
      - LABEL_kkutbot=kkutbot
      - URL_kkutbot=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - ENGINE_kkutbot=mongo@dbgate-plugin-mongo
      - LOGIN=${DBGATE_LOGIN}
      - PASSWORD=${DBGATE_PASSWORD}
    depends_on:
      - mongo
  mongob:
    image: janu8ry/mongob:arm64
    restart: always
    container_name: "kkutbot-mongob"
    volumes:
      - ./config.yml:/mongob/config.yml
      - ./backup:/backup
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - mongo
  loki:
    image: grafana/loki:3.3.2
    restart: always
    container_name: "kkutbot-loki"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./obs/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    environment:
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  alloy:
    image: grafana/alloy:v1.5.1
    restart: always
    container_name: "kkutbot-alloy"
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./obs/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=Asia/Seoul
    depends_on:
      loki:
        condition: service_healthy
  grafana:
    image: grafana/grafana:11.4.0
    restart: always
    container_name: "kkutbot-grafana"
    ports:
      - "3000:3000"
    volumes:
      - ./obs/loki-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana-data:/var/lib/grafana
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      loki:
        condition: service_healthy

volumes:
  dbgate-data:
  loki-data:
  grafana-data:
  alloy-data:
