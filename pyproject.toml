[project]
name = "kkutbot"
version = "3.0.0"
description = "끝말잇기 디스코드봇"
readme = "README.md"
requires-python = ">=3.14.6"
license = {file="LICENSE"}
authors = [
    {name="Junho Lee", email="janu8ry0108@gmail.com"}
]
dependencies = [
    "discord-py[speed]==2.7.1",
    "jishaku[procinfo]==2.7.5",
    "koreanbots>=4.0.0",
    "topggpy==1.4.0",
    "motor==3.7.1",
    "beanie==2.1.0",
    "rich==15.0.0",
    "sentry-sdk==2.66.0",
    "python-dotenv==1.2.2",
    "apscheduler>=3.11.3",
    "humanize==4.16.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
]

[tool.uv]
package = false

[project.urls]
homepage = "https://kkutbot.github.io"
repository = "https://github.com/janu8ry/kkutbot"

[tool.ruff]
line-length = 150
indent-width = 4
respect-gitignore = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = false
warn_unused_configs = true
show_error_codes = true
disable_error_code = "misc"
exclude = ".venv"

[[tool.mypy.overrides]]
module = ["discord.*", "motor.*", "apscheduler.*", "rich.*", "koreanbots.*", "topgg.*", "psutil.*"]
ignore_missing_imports = true
